<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Timetable</title>
    <style>
        table, th, td {
        border: 1px solid black;
        border-collapse: collapse;
        padding: 8px; /* Adds space inside the cells */
        }
    </style>

</head>
<body>
    <section>
        <h1>Weekly Timetable</h1>
        <table>
            <tr>
                <th>Monday</th>
                <th>Tuesday</th>
                <th>Wednesday</th>
                <th>Thursday</th>
                <th>Friday</th>
            </tr>
            <tr>
                <td>Mathematics <br> English <br> Geography</td>
                <td>Biology <br> Kiswahili <br> History</td>
                <td>CRE <br> Physics <br> Agriculture</td>
                <td>Chemistry <br> Home Science <br> Mathematics</td>
                <td>Physics <br> Computer Studies <br> Business Studies</td>
            </tr>
        </table>
    </section>
</body>
</html>
